<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales History - OGONG Hardware</title>
  <link rel="stylesheet" href="css/styles.css">

  <style>
    .sales-page { min-width: 0; background: #f7f9fc; }
    .sales-page .header { align-items: center; gap: 18px; margin-bottom: 20px; }
    .sales-title { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .sales-title-icon { display: grid; place-items: center; width: 44px; height: 44px; flex: 0 0 44px; color: #1769e0; background: #edf5ff; border-radius: 10px; }
    .sales-title-icon svg { width: 22px; height: 22px; }
    .sales-page .header h2 { margin: 0 0 5px; color: #102a43; font-size: 27px; }
    .sales-page .header p { margin: 0; color: #708198; font-size: 13px; }
    .sales-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 17px;
    }

    .sales-summary .card {
      position: relative;
      min-width: 0;
      min-height: 100px;
      margin: 0;
      padding: 16px;
      border-color: #e4eaf1;
      border-radius: 10px;
      box-shadow: 0 5px 16px rgba(16,42,67,.045);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .sales-summary .card:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(16,42,67,.075); }
    .sales-summary h3 { margin: 0; color: #73849a; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .sales-summary p { margin: 12px 0 0; color: #102a43; font-size: 23px; font-weight: 800; }
    .sales-summary .sales-summary-total { color: #059669; }
    .sales-toolbar {
      display: flex;
      align-items: end;
      gap: 9px;
      flex-wrap: wrap;
      padding: 14px;
      margin-bottom: 13px;
      background: #fff;
      border: 1px solid #e4eaf1;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(16,42,67,.035);
    }

    .sales-toolbar .form-group { flex: 1 1 175px; min-width: 155px; margin: 0; }
    .sales-toolbar .form-group label { color: #52677d; font-size: 10px; font-weight: 700; }
    .sales-toolbar input, .sales-toolbar select { height: 39px; padding: 8px 11px; color: #183653; border-color: #e1e8f0; border-radius: 7px; font-size: 12px; }
    .sales-toolbar input::placeholder { color: #98a7b8; }
    .sales-toolbar input:focus, .sales-toolbar select:focus { border-color: #75a9ed; box-shadow: 0 0 0 3px #edf5ff; }
    .sales-actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .sales-page .button { display: inline-flex; align-items: center; justify-content: center; min-height: 37px; padding: 8px 12px; border-radius: 7px; font-size: 11px; font-weight: 700; transition: background-color .16s ease, border-color .16s ease, transform .16s ease; }
    .sales-page .button-secondary { color: #31516e; background: #f4f8fd; border: 1px solid #e2eaf3; }
    .sales-page .button-secondary:hover { background: #eaf2fc; border-color: #cfe1f9; }
    .sales-table-card { padding: 0; overflow: hidden; border-radius: 10px; box-shadow: 0 6px 18px rgba(16,42,67,.045); }
    .sales-table { min-width: 720px; border-collapse: collapse; }
    .sales-table thead { background: #f8fafc; }
    .sales-table th { padding: 12px 14px; color: #8a9bb0; font-size: 9px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
    .sales-table td { padding: 12px 14px; color: #61758a; border-bottom: 1px solid #edf2f7; font-size: 11px; vertical-align: middle; }
    .sales-table tbody tr { transition: background-color .16s ease; }
    .sales-table tbody tr:last-child td { border-bottom: 0; }
    .sales-table tbody tr:hover { background: #f9fbfe; }
    .sales-invoice { color: #183653; font-weight: 800; }
    .sales-amount { color: #183653; font-weight: 800; white-space: nowrap; }
    .sales-payment { display: inline-flex; padding: 5px 8px; color: #31516e; background: #f1f5f9; border-radius: 999px; font-size: 9px; font-weight: 800; white-space: nowrap; }
    .sales-table .button:hover { transform: translateY(-1px); }
    .sales-page .loading-state, .sales-page .empty-state { padding: 30px; color: #8293a7; text-align: center; font-size: 12px; }
    .sale-detail-header {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .sale-detail-box {
      min-width: 0;
      padding: 12px;
      background: #f7f9fc;
      border: 1px solid #e8eef5;
      border-radius: 8px;
    }

    .sale-detail-box small {
      display: block;
      margin-bottom: 5px;
      color: #8a9bb0;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .sale-detail-box strong {
      color: #183653;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .receipt-total {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      margin-top: 10px;
      border-top: 1px solid #e8eef5;
      color: #708198;
      font-size: 13px;
      font-weight: 700;
    }

    .receipt-total strong { color: #102a43; font-size: 18px; }
    .receipt-payment { padding: 12px; margin-top: 8px; background: #f7f9fc; border-radius: 8px; color: #61758a; font-size: 12px; }
    .receipt-payment p { margin: 4px 0; }
    #sale-detail-modal .modal-content { width: min(680px, 95vw); padding: 23px; border-radius: 12px; }
    #sale-detail-modal .modal-header { padding-bottom: 14px; border-bottom: 1px solid #edf2f7; }
    #sale-detail-modal .modal-header h2 { color: #102a43; font-size: 18px; }
    #sale-detail-modal .modal-close { width: 32px; height: 32px; color: #6b7f93; background: #f4f7fa; border-radius: 7px; }

    @media (max-width: 768px) {
      .sales-page { padding: 18px 14px; }
      .sales-page .header { align-items: flex-start; }
      .sales-page .header h2 { font-size: 23px; }
      .sales-toolbar { align-items: stretch; padding: 11px; }
      .sales-toolbar .form-group { flex: 1 1 calc(50% - 5px); min-width: 0; }
      .sales-actions { width: 100%; }
      .sales-actions .button { flex: 1; }
      #sale-detail-modal .modal-content { padding: 18px; }
    }

    @media (max-width: 480px) {
      .sales-title { align-items: flex-start; gap: 9px; }
      .sales-title-icon { width: 38px; height: 38px; flex-basis: 38px; }
      .sales-summary { gap: 9px; }
      .sales-summary .card { min-height: 88px; padding: 12px; }
      .sales-summary p { font-size: 19px; }
      .sales-toolbar .form-group { flex-basis: 100%; }
      .sales-actions { flex-wrap: wrap; }
      .sales-actions .button { flex: 1 1 calc(50% - 5px); }
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #sale-detail-modal,
      #sale-detail-modal * {
        visibility: visible;
      }

      #sale-detail-modal {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

      .modal-close,
      .receipt-actions {
        display: none !important;
      }
    }

    .dashboard-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      
      
    }

    .dashboard-logo-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #0f2747;
      background:
          linear-gradient(
                    rgba(0, 0, 0, 0.326),
                    rgba(0, 0, 0, 0.44)
                ),
          url("images/logo.png");
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(15, 39, 71, 0.18);
    }

    .dashboard-logo-text {
      line-height: 1.1;
    }

    .dashboard-logo-text strong {
      display: block;
      font-size: 16px;
      color: #0f2747;
    }

    .dashboard-logo-text span {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
      letter-spacing: .5px;
    }
    
  </style>
</head>

<body>

<div class="container">

 <aside class="sidebar">

      <div class="dashboard-logo">

        <div class="dashboard-logo-mark">
          OG
        </div>

        <div class="dashboard-logo-text">
          <strong>OGONG HARDWARE</strong>
          <span>BUILT TOGETHER</span>
        </div>

      </div>

      <div id="sidebar-nav"></div>

    </aside>

  <!-- MAIN -->
  <main class="main sales-page">

    <!-- HEADER -->
    <div class="header">
      <div class="sales-title">
        <span class="sales-title-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5M8 17h3"/></svg>
        </span>
        <div>
        <h2>Sales History</h2>
        <p>Review completed store transactions and sale details.</p>
        </div>
      </div>
    </div>

    <div id="alert-container"></div>

    <!-- SUMMARY -->
    <div class="sales-summary">

      <div class="card">
        <h3>Transactions</h3>
        <p id="sales-count">0</p>
      </div>

      <div class="card">
        <h3>Total Sales</h3>
        <p class="sales-summary-total" id="sales-total">₱0.00</p>
      </div>

    </div>

    <!-- FILTERS -->
    <div class="sales-toolbar">

        <div class="form-group">
          <label for="sales-search">Search</label>
          <input
            id="sales-search"
            type="text"
            placeholder="Invoice or cashier..."
          >
        </div>

        <div class="form-group">
          <label for="sales-payment">Payment Method</label>
          <select id="sales-payment">
            <option value="">All Payment Methods</option>
            <option value="Cash">Cash</option>
            <option value="GCash">GCash</option>
            <option value="Bank Transfer">Bank Transfer</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sales-start-date">From date</label>
          <input id="sales-start-date" type="date">
        </div>

        <div class="form-group">
          <label for="sales-end-date">To date</label>
          <input id="sales-end-date" type="date">
        </div>

        <div class="sales-actions">

          <button
            class="button button-secondary"
            id="sales-search-btn"
            type="button"
          >
            Search
          </button>

          <button
            class="button button-secondary"
            id="sales-clear-btn"
            type="button"
          >
            Clear
          </button>

          <button
            class="button button-secondary"
            id="sales-refresh-btn"
            type="button"
          >
            Refresh
          </button>

        </div>

    </div>

    <!-- SALES TABLE -->
    <div class="table-card sales-table-card">

      <div class="table-responsive">

        <table class="sales-table">

          <thead>
            <tr>
              <th>Invoice</th>
              <th>Date</th>
              <th>Cashier</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="sales-table-body"></tbody>

        </table>

      </div>

    </div>

  </main>

</div>


<!-- SALE DETAIL MODAL -->
<div class="modal" id="sale-detail-modal">

  <div class="modal-content">

    <div class="modal-header">

      <h2>Sale Receipt</h2>

      <button
        class="modal-close"
        type="button"
        onclick="closeModal('sale-detail-modal')"
      >
        ×
      </button>

    </div>

    <div id="sale-detail-content"></div>

    <div
      class="top-bar receipt-actions"
      style="margin-top: 16px;"
    >

      <button
        class="button button-primary"
        id="print-sale-btn"
        type="button"
      >
        Print Receipt
      </button>

      <button
        class="button button-secondary"
        type="button"
        onclick="closeModal('sale-detail-modal')"
      >
        Close
      </button>

    </div>

  </div>

</div>


<script src="js/app.js?v=render-api-1"></script>

<script>

  const user = requireAuth();

  if (!user) {
    window.location.href = 'login.html';
  } else {

    renderSidebar('sales');
    renderTopbar();
    setupModalClose('sale-detail-modal');

  }


  let allSales = [];


  /*
   * LOAD SALES
   */
  async function loadSales(search = '') {

    const tbody = document.getElementById('sales-table-body');

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="loading-state">
          Loading sales...
        </td>
      </tr>
    `;

    try {

      const query = search
        ? `?search=${encodeURIComponent(search)}`
        : '';

      const sales = await apiFetch(`/sales${query}`);

      allSales = Array.isArray(sales) ? sales : [];

      renderSales(allSales);

    } catch (error) {

      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="empty-state">
            Unable to load sales.
          </td>
        </tr>
      `;

      showAlert(error.message, 'danger');

    }

  }


  /*
   * RENDER SALES
   */
  function renderSales(sales) {

    const tbody =
      document.getElementById('sales-table-body');

    const payment =
      document.getElementById('sales-payment').value;
    const startDate =
      document.getElementById('sales-start-date').value;
    const endDate =
      document.getElementById('sales-end-date').value;

    const filteredSales = sales.filter(sale => {
      if (payment && sale.payment_method !== payment) return false;
      if (!startDate && !endDate) return true;

      const saleDate = new Date(sale.sale_date);
      if (Number.isNaN(saleDate.getTime())) return false;

      const saleDay = [
        saleDate.getFullYear(),
        String(saleDate.getMonth() + 1).padStart(2, '0'),
        String(saleDate.getDate()).padStart(2, '0')
      ].join('-');

      return (!startDate || saleDay >= startDate) &&
        (!endDate || saleDay <= endDate);
    });


    // SUMMARY

    document.getElementById('sales-count').textContent =
      filteredSales.length;

    const total = filteredSales.reduce(
      (sum, sale) =>
        sum + Number(sale.total_amount || 0),
      0
    );

    document.getElementById('sales-total').textContent =
      formatCurrency(total);


    // EMPTY STATE

    if (!filteredSales.length) {

      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="empty-state">
            No sales transactions found.
          </td>
        </tr>
      `;

      return;

    }


    tbody.innerHTML = '';


    filteredSales.forEach(sale => {

      const row = document.createElement('tr');

      const date = sale.sale_date
        ? new Date(sale.sale_date).toLocaleString()
        : '-';

      row.innerHTML = `

        <td class="sales-invoice">
          <strong>${escapeHTML(sale.invoice_number)}</strong>
        </td>

        <td>
          ${escapeHTML(date)}
        </td>

        <td>
          ${escapeHTML(sale.cashier || '-')}
        </td>

        <td class="sales-amount">
          <strong>
            ${formatCurrency(sale.total_amount)}
          </strong>
        </td>

        <td>
          <span class="sales-payment">${escapeHTML(sale.payment_method || '-')}</span>
        </td>

        <td>

          <button
            class="button button-secondary"
            type="button"
            onclick="viewSale(${sale.id})"
          >
            View
          </button>

        </td>

      `;

      tbody.appendChild(row);

    });

  }


  /*
   * VIEW SALE
   */
  async function viewSale(id) {

    try {

      const sale =
        await apiFetch(`/sales/${id}`);

      const rows =
        (sale.items || []).map(item => `

          <tr>

            <td>
              ${escapeHTML(item.product_name)}
            </td>

            <td>
              ${item.quantity}
            </td>

            <td>
              ${formatCurrency(item.price)}
            </td>

            <td>
              ${formatCurrency(item.subtotal)}
            </td>

          </tr>

        `).join('');


      document.getElementById(
        'sale-detail-content'
      ).innerHTML = `

        <div class="sale-detail-header">

          <div class="sale-detail-box">
            <small>Invoice</small>
            <strong>
              ${escapeHTML(sale.invoice_number)}
            </strong>
          </div>

          <div class="sale-detail-box">
            <small>Date</small>
            <strong>
              ${escapeHTML(
                new Date(sale.sale_date).toLocaleString()
              )}
            </strong>
          </div>

          <div class="sale-detail-box">
            <small>Cashier</small>
            <strong>
              ${escapeHTML(sale.cashier || '-')}
            </strong>
          </div>

          <div class="sale-detail-box">
            <small>Payment Method</small>
            <strong>
              ${escapeHTML(sale.payment_method || '-')}
            </strong>
          </div>

        </div>


        <div class="table-responsive">

          <table>

            <thead>

              <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Amount</th>
              </tr>

            </thead>

            <tbody>

              ${rows || `
                <tr>
                  <td colspan="4">
                    No items found.
                  </td>
                </tr>
              `}

            </tbody>

          </table>

        </div>


        <div class="receipt-total">

          <span>Total</span>

          <strong>
            ${formatCurrency(sale.total_amount)}
          </strong>

        </div>


        <div class="receipt-payment">

          <p>
            <strong>Payment:</strong>
            ${escapeHTML(sale.payment_method || '-')}
          </p>

          ${
            sale.payment_method === 'Cash'
              ? `
                <p>
                  <strong>Amount Received:</strong>
                  ${formatCurrency(sale.amount_received)}
                </p>

                <p>
                  <strong>Change:</strong>
                  ${formatCurrency(sale.change_amount)}
                </p>
              `
              : ''
          }

        </div>

      `;


      openModal('sale-detail-modal');

    } catch (error) {

      showAlert(error.message, 'danger');

    }

  }


  /*
   * SEARCH
   */
  document
    .getElementById('sales-search-btn')
    .addEventListener('click', () => {

      const search =
        document.getElementById('sales-search')
          .value
          .trim();

      loadSales(search);

    });


  /*
   * ENTER KEY SEARCH
   */
  document
    .getElementById('sales-search')
    .addEventListener('keydown', event => {

      if (event.key === 'Enter') {

        document
          .getElementById('sales-search-btn')
          .click();

      }

    });


  /*
   * PAYMENT FILTER
   */
  document
    .getElementById('sales-payment')
    .addEventListener('change', () => {

      renderSales(allSales);

    });

  document
    .getElementById('sales-start-date')
    .addEventListener('change', () => renderSales(allSales));

  document
    .getElementById('sales-end-date')
    .addEventListener('change', () => renderSales(allSales));


  /*
   * CLEAR
   */
  document
    .getElementById('sales-clear-btn')
    .addEventListener('click', () => {

      document.getElementById('sales-search').value = '';

      document.getElementById('sales-payment').value = '';
      document.getElementById('sales-start-date').value = '';
      document.getElementById('sales-end-date').value = '';

      loadSales();

    });


  /*
   * REFRESH
   */
  document
    .getElementById('sales-refresh-btn')
    .addEventListener('click', () => {

      loadSales(
        document.getElementById('sales-search').value.trim()
      );

    });


  /*
   * PRINT RECEIPT
   */
  document
    .getElementById('print-sale-btn')
    .addEventListener('click', () => {

      window.print();

    });


  /*
   * ESCAPE HTML
   */
  function escapeHTML(value) {

    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  // INITIAL LOAD
  loadSales();

</script>

</body>
</html>
