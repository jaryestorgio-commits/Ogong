<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers - OGONG Hardware</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .dashboard-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .dashboard-logo-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      color: #fff;
      background: linear-gradient(rgba(0,0,0,.326), rgba(0,0,0,.44)), url("images/logo.png");
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(15,39,71,.18);
      font-size: 22px;
      font-weight: 800;
    }
    .dashboard-logo-text { line-height: 1.1; }
    .dashboard-logo-text strong { display: block; color: #0f2747; font-size: 16px; }
    .dashboard-logo-text span { display: block; margin-top: 3px; color: #64748b; font-size: 11px; letter-spacing: .5px; }
    .suppliers-page { min-width: 0; background: #f7f9fc; }
    .suppliers-page .header { align-items: center; gap: 18px; margin-bottom: 20px; }
    .suppliers-title { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .suppliers-title-icon { display: grid; place-items: center; width: 44px; height: 44px; flex: 0 0 44px; color: #1769e0; background: #edf5ff; border-radius: 10px; }
    .suppliers-title-icon svg { width: 22px; height: 22px; }
    .suppliers-page .header h2 { margin: 0 0 5px; color: #102a43; font-size: 27px; }
    .suppliers-page .header p { margin: 0; color: #708198; font-size: 13px; }
    .suppliers-page .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 37px; padding: 8px 12px; border-radius: 7px; font-size: 11px; font-weight: 700; transition: background-color .16s ease, border-color .16s ease, transform .16s ease; }
    .suppliers-page .button-primary { background: #1769e0; box-shadow: 0 4px 10px rgba(23,105,224,.16); }
    .suppliers-page .button-primary:hover { background: #1058c4; }
    .suppliers-page .button-secondary { color: #31516e; background: #f4f8fd; border: 1px solid #e2eaf3; }
    .suppliers-page .button-secondary:hover { color: #1769e0; background: #edf5ff; border-color: #cfe1f9; }
    .supplier-toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding: 13px; margin-bottom: 13px; background: #fff; border: 1px solid #e4eaf1; border-radius: 10px; box-shadow: 0 4px 14px rgba(16,42,67,.035); }
    .supplier-toolbar input { flex: 1 1 260px; min-width: 190px; height: 39px; padding: 8px 11px; color: #183653; border-color: #e1e8f0; border-radius: 7px; font-size: 12px; }
    .supplier-toolbar input::placeholder { color: #98a7b8; }
    .supplier-toolbar input:focus, .suppliers-modal .form-group input:focus, .suppliers-modal .form-group textarea:focus { border-color: #75a9ed; box-shadow: 0 0 0 3px #edf5ff; }
    .supplier-table-card { padding: 0; overflow: hidden; border-radius: 10px; box-shadow: 0 6px 18px rgba(16,42,67,.045); }
    .supplier-table { min-width: 850px; border-collapse: collapse; }
    .supplier-table thead { background: #f8fafc; }
    .supplier-table th { padding: 12px 14px; color: #8a9bb0; font-size: 9px; font-weight: 800; text-align: left; text-transform: uppercase; white-space: nowrap; }
    .supplier-table td { padding: 12px 14px; color: #61758a; border-bottom: 1px solid #edf2f7; font-size: 11px; vertical-align: middle; }
    .supplier-table tbody tr { transition: background-color .16s ease; }
    .supplier-table tbody tr:last-child td { border-bottom: 0; }
    .supplier-table tbody tr:hover { background: #f9fbfe; }
    .supplier-id { color: #8a9bb0 !important; font-size: 10px !important; font-weight: 700; }
    .supplier-name-cell { display: flex; align-items: center; gap: 10px; min-width: 175px; }
    .supplier-row-icon { display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 34px; color: #1769e0; background: #edf5ff; border-radius: 8px; }
    .supplier-row-icon svg { width: 17px; height: 17px; }
    .supplier-name-cell strong { color: #183653; font-size: 11px; overflow-wrap: anywhere; }
    .supplier-contact { color: #52677d; font-weight: 600; }
    .supplier-detail { display: block; max-width: 220px; overflow: hidden; color: #61758a; text-overflow: ellipsis; white-space: nowrap; }
    .supplier-empty { padding: 28px !important; color: #8293a7 !important; text-align: center; }
    .supplier-actions { display: flex; justify-content: flex-end; gap: 6px; white-space: nowrap; }
    .suppliers-page .button-danger { color: #b42318; background: #fff5f4; border: 1px solid #f5d3d0; }
    .suppliers-page .button-danger:hover { background: #fff0ef; border-color: #ecb8b2; }
    .supplier-table .button:hover { transform: translateY(-1px); }
    .suppliers-modal .modal-content { width: min(660px, 95vw); max-height: calc(100vh - 36px); padding: 23px; border-radius: 12px; }
    .suppliers-modal .modal-header { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid #edf2f7; }
    .suppliers-modal .modal-header h2 { margin: 0; color: #102a43; font-size: 18px; }
    .suppliers-modal .modal-close { width: 32px; height: 32px; color: #6b7f93; background: #f4f7fa; border-radius: 7px; }
    .supplier-modal-subtitle { margin: -4px 0 16px; color: #8293a7; font-size: 11px; line-height: 1.5; }
    .supplier-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 13px; }
    .supplier-form-grid .form-group { margin-bottom: 12px; }
    .supplier-form-grid .form-group:last-child { grid-column: 1 / -1; }
    .suppliers-modal .form-group label { color: #52677d; font-size: 11px; font-weight: 700; }
    .suppliers-modal .form-group input, .suppliers-modal .form-group textarea { min-height: 39px; padding: 8px 10px; color: #183653; border-color: #dfe7f0; border-radius: 7px; font-size: 12px; }
    .suppliers-modal .form-group textarea { min-height: 78px; resize: vertical; }
    .supplier-modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 14px; margin-top: 6px; border-top: 1px solid #edf2f7; }
    @media (max-width: 768px) {
      .suppliers-page { padding: 18px 14px; }
      .suppliers-page .header { align-items: flex-start; gap: 14px; }
      .suppliers-page .header h2 { font-size: 23px; }
      .suppliers-page .header > .button { flex: 0 0 auto; padding: 9px 10px; }
      .suppliers-title { align-items: flex-start; gap: 9px; }
      .suppliers-title-icon { width: 38px; height: 38px; flex-basis: 38px; }
      .supplier-toolbar { align-items: stretch; padding: 11px; }
      .supplier-toolbar input { flex-basis: 100%; width: 100%; min-width: 0; }
      .supplier-toolbar .button { flex: 1; }
      .suppliers-modal .modal-content { padding: 18px; }
    }
    @media (max-width: 520px) {
      .suppliers-page .header { flex-direction: column; }
      .suppliers-page .header > .button { align-self: stretch; }
      .supplier-form-grid { grid-template-columns: 1fr; gap: 0; }
      .supplier-form-grid .form-group:last-child { grid-column: auto; }
    }
  </style>
</head>
<body>

<div class="container">

  <aside class="sidebar">

      <div class="dashboard-logo">

        <div class="dashboard-logo-mark">
          OG
        </div>

        <div class="dashboard-logo-text">
          <strong>OGONG HARDWARE</strong>
          <span>BUILT TOGETHER</span>
        </div>

      </div>

      <div id="sidebar-nav"></div>

    </aside>

  <!-- MAIN -->
  <main class="main suppliers-page">

    <!-- HEADER -->
    <div class="header">
      <div class="suppliers-title">
        <span class="suppliers-title-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v13H3z"/><path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/><path d="M3 12h18M10 12v2h4v-2"/></svg>
        </span>
        <div>
        <h2>Suppliers</h2>
        <p>Manage supplier information and contacts.</p>
        </div>
      </div>

      <button
        class="button button-primary"
        id="add-supplier-btn"
        type="button"
      >
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add Supplier
      </button>
    </div>

    <div id="alert-container"></div>

    <!-- SEARCH -->
    <div class="supplier-toolbar">

      <input
        class="search-input"
        id="supplier-search"
        type="text"
        placeholder="Search suppliers..."
      >

      <button
        class="button button-secondary"
        id="supplier-search-btn"
        type="button"
      >
        Search
      </button>

      <button
        class="button button-secondary"
        id="supplier-refresh-btn"
        type="button"
      >
        Refresh
      </button>

    </div>

    <!-- SUPPLIERS TABLE -->
    <div class="table-card supplier-table-card">

      <div class="table-responsive">

        <table class="supplier-table">

          <thead>
            <tr>
              <th>ID</th>
              <th>Supplier Name</th>
              <th>Contact Person</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="suppliers-table-body"></tbody>

        </table>

      </div>

    </div>

  </main>

</div>


<!-- ==============================
     SUPPLIER MODAL
     ============================== -->

<div class="modal suppliers-modal" id="supplier-modal">

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="supplier-modal-title">
        Add Supplier
      </h2>

      <button
        class="modal-close"
        type="button"
        id="supplier-modal-close"
      >
        ×
      </button>

    </div>

    <div id="supplier-modal-alert"></div>
    <p class="supplier-modal-subtitle">Keep supplier contact details organized for inventory and purchasing.</p>
    <div class="supplier-form-grid">

    <!-- SUPPLIER NAME -->
    <div class="form-group">

      <label for="supplier-name">
        Supplier Name <span class="required">*</span>
      </label>

      <input
        id="supplier-name"
        type="text"
        placeholder="Enter supplier name"
        maxlength="150"
      >

    </div>

    <!-- CONTACT PERSON -->
    <div class="form-group">

      <label for="supplier-contact">
        Contact Person
      </label>

      <input
        id="supplier-contact"
        type="text"
        placeholder="Enter contact person"
        maxlength="150"
      >

    </div>

    <!-- PHONE -->
    <div class="form-group">

      <label for="supplier-phone">
        Phone Number
      </label>

      <input
        id="supplier-phone"
        type="tel"
        placeholder="Enter phone number"
        maxlength="30"
      >

    </div>

    <!-- EMAIL -->
    <div class="form-group">

      <label for="supplier-email">
        Email
      </label>

      <input
        id="supplier-email"
        type="email"
        placeholder="Enter email address"
        maxlength="150"
      >

    </div>

    <!-- ADDRESS -->
    <div class="form-group">

      <label for="supplier-address">
        Address
      </label>

      <textarea
        id="supplier-address"
        rows="3"
        placeholder="Enter supplier address"
        maxlength="300"
      ></textarea>

    </div>
    </div>

    <!-- BUTTONS -->
    <div class="supplier-modal-actions">

      <button
        class="button button-primary"
        id="save-supplier-btn"
        type="button"
      >
        Save Supplier
      </button>

      <button
        class="button button-secondary"
        id="cancel-supplier-btn"
        type="button"
      >
        Cancel
      </button>

    </div>

  </div>

</div>


<!-- JAVASCRIPT -->

<script src="js/app.js?v=render-api-1"></script>

<script>

let editingSupplierId = null;

const user = requireAuth();

if (!user) {

  window.location.href = 'login.html';

} else {

  renderSidebar('suppliers');

}


/* ==============================
   OPEN MODAL
   ============================== */

function openSupplierModal(supplier = null) {

  editingSupplierId = supplier ? supplier.id : null;

  document.getElementById(
    'supplier-modal-title'
  ).textContent = supplier
    ? 'Edit Supplier'
    : 'Add Supplier';

  document.getElementById('supplier-name').value =
    supplier?.supplier_name || '';

  document.getElementById('supplier-contact').value =
    supplier?.contact_person || '';

  document.getElementById('supplier-phone').value =
    supplier?.phone || '';

  document.getElementById('supplier-email').value =
    supplier?.email || '';

  document.getElementById('supplier-address').value =
    supplier?.address || '';

  document.getElementById(
    'supplier-modal-alert'
  ).innerHTML = '';

  openModal('supplier-modal');

}


/* ==============================
   CLOSE MODAL
   ============================== */

function closeSupplierModal() {

  closeModal('supplier-modal');

  editingSupplierId = null;

  document.getElementById(
    'supplier-modal-title'
  ).textContent = 'Add Supplier';

  document.getElementById('supplier-name').value = '';
  document.getElementById('supplier-contact').value = '';
  document.getElementById('supplier-phone').value = '';
  document.getElementById('supplier-email').value = '';
  document.getElementById('supplier-address').value = '';

  document.getElementById(
    'supplier-modal-alert'
  ).innerHTML = '';

}


/* ==============================
   LOAD SUPPLIERS
   ============================== */

async function loadSuppliers(search = '') {

  const tbody =
    document.getElementById(
      'suppliers-table-body'
    );

  tbody.innerHTML = `
    <tr>
      <td colspan="7" class="supplier-empty">
        Loading suppliers...
      </td>
    </tr>
  `;

  try {

    const endpoint =
      search
        ? `/suppliers?search=${encodeURIComponent(search)}`
        : '/suppliers';

    const suppliers =
      await apiFetch(endpoint);

    tbody.innerHTML = '';

    if (!suppliers || suppliers.length === 0) {

      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="supplier-empty">
            No suppliers found.
          </td>
        </tr>
      `;

      return;

    }


    suppliers.forEach(supplier => {

      const row =
        document.createElement('tr');

      row.innerHTML = `

        <td class="supplier-id">
          #${supplier.id}
        </td>

        <td>
          <div class="supplier-name-cell">
            <span class="supplier-row-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v13H3z"/><path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/><path d="M3 12h18M10 12v2h4v-2"/></svg></span>
            <strong>${escapeHtml(supplier.supplier_name)}</strong>
          </div>
        </td>

        <td class="supplier-contact">
          ${escapeHtml(
            supplier.contact_person || '—'
          )}
        </td>

        <td>
          <span class="supplier-detail" title="${escapeHtml(supplier.phone || '—')}">
          ${escapeHtml(
            supplier.phone || '—'
          )}
          </span>
        </td>

        <td>
          <span class="supplier-detail" title="${escapeHtml(supplier.email || '—')}">
          ${escapeHtml(
            supplier.email || '—'
          )}
          </span>
        </td>

        <td>
          <span class="supplier-detail" title="${escapeHtml(supplier.address || '—')}">
          ${escapeHtml(
            supplier.address || '—'
          )}
          </span>
        </td>

        <td>
          <div class="supplier-actions">

          <button
            class="button button-secondary"
            type="button"
            onclick="editSupplier(${supplier.id})"
          >
            Edit
          </button>

          <button
            class="button button-danger"
            type="button"
            onclick="deleteSupplier(${supplier.id})"
          >
            Delete
          </button>
          </div>

        </td>

      `;

      tbody.appendChild(row);

    });

  } catch (error) {

    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="supplier-empty">
          Unable to load suppliers.
        </td>
      </tr>
    `;

    showAlert(
      error.message || 'Unable to load suppliers.',
      'danger'
    );

  }

}


/* ==============================
   EDIT SUPPLIER
   ============================== */

async function editSupplier(id) {

  try {

    const suppliers =
      await apiFetch('/suppliers');

    const supplier =
      suppliers.find(
        item => Number(item.id) === Number(id)
      );

    if (!supplier) {

      throw new Error(
        'Supplier not found.'
      );

    }

    openSupplierModal(supplier);

  } catch (error) {

    showAlert(
      error.message,
      'danger'
    );

  }

}


/* ==============================
   DELETE SUPPLIER
   ============================== */

async function deleteSupplier(id) {

  const confirmed =
    confirm(
      'Are you sure you want to delete this supplier?'
    );

  if (!confirmed) return;

  try {

    await apiFetch(
      `/suppliers/${id}`,
      {
        method: 'DELETE'
      }
    );

    showAlert(
      'Supplier deleted successfully.',
      'success'
    );

    await loadSuppliers(
      document
        .getElementById('supplier-search')
        .value
        .trim()
    );

  } catch (error) {

    showAlert(
      error.message,
      'danger'
    );

  }

}


/* ==============================
   SAVE SUPPLIER
   ============================== */

async function saveSupplier() {

  const supplier = {

    supplier_name:
      document
        .getElementById('supplier-name')
        .value
        .trim(),

    contact_person:
      document
        .getElementById('supplier-contact')
        .value
        .trim(),

    phone:
      document
        .getElementById('supplier-phone')
        .value
        .trim(),

    email:
      document
        .getElementById('supplier-email')
        .value
        .trim(),

    address:
      document
        .getElementById('supplier-address')
        .value
        .trim()

  };


  /* REQUIRED FIELD */

  if (!supplier.supplier_name) {

    document.getElementById(
      'supplier-modal-alert'
    ).innerHTML = `
      <div class="alert alert-danger">
        Supplier name is required.
      </div>
    `;

    return;

  }


  /* EMAIL VALIDATION */

  if (
    supplier.email &&
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
      supplier.email
    )
  ) {

    document.getElementById(
      'supplier-modal-alert'
    ).innerHTML = `
      <div class="alert alert-danger">
        Please enter a valid email address.
      </div>
    `;

    return;

  }


  const saveButton =
    document.getElementById(
      'save-supplier-btn'
    );

  saveButton.disabled = true;

  saveButton.textContent =
    editingSupplierId
      ? 'Updating...'
      : 'Saving...';


  try {

    if (editingSupplierId) {

      await apiFetch(
        `/suppliers/${editingSupplierId}`,
        {
          method: 'PUT',
          body: JSON.stringify(supplier)
        }
      );

      showAlert(
        'Supplier updated successfully.',
        'success'
      );

    } else {

      await apiFetch(
        '/suppliers',
        {
          method: 'POST',
          body: JSON.stringify(supplier)
        }
      );

      showAlert(
        'Supplier added successfully.',
        'success'
      );

    }

    closeSupplierModal();

    await loadSuppliers(
      document
        .getElementById('supplier-search')
        .value
        .trim()
    );

  } catch (error) {

    document.getElementById(
      'supplier-modal-alert'
    ).innerHTML = `
      <div class="alert alert-danger">
        ${escapeHtml(
          error.message ||
          'Unable to save supplier.'
        )}
      </div>
    `;

  } finally {

    saveButton.disabled = false;

    saveButton.textContent =
      'Save Supplier';

  }

}


/* ==============================
   ESCAPE HTML
   ============================== */

function escapeHtml(value) {

  const div =
    document.createElement('div');

  div.textContent =
    value == null ? '' : String(value);

  return div.innerHTML;

}


/* ==============================
   EVENTS
   ============================== */

document
  .getElementById('add-supplier-btn')
  .addEventListener(
    'click',
    () => openSupplierModal()
  );


document
  .getElementById('supplier-modal-close')
  .addEventListener(
    'click',
    closeSupplierModal
  );


document
  .getElementById('cancel-supplier-btn')
  .addEventListener(
    'click',
    closeSupplierModal
  );


document
  .getElementById('save-supplier-btn')
  .addEventListener(
    'click',
    saveSupplier
  );


document
  .getElementById('supplier-search-btn')
  .addEventListener(
    'click',
    () => {

      const search =
        document
          .getElementById('supplier-search')
          .value
          .trim();

      loadSuppliers(search);

    }
  );


document
  .getElementById('supplier-refresh-btn')
  .addEventListener(
    'click',
    () => {

      document
        .getElementById('supplier-search')
        .value = '';

      loadSuppliers();

    }
  );


/* ENTER TO SEARCH */

document
  .getElementById('supplier-search')
  .addEventListener(
    'keydown',
    event => {

      if (event.key === 'Enter') {

        document
          .getElementById(
            'supplier-search-btn'
          )
          .click();

      }

    }
  );


/* ESC TO CLOSE MODAL */

document.addEventListener(
  'keydown',
  event => {

    if (
      event.key === 'Escape'
    ) {

      closeSupplierModal();

    }

  }
);


/* INITIAL LOAD */

loadSuppliers();

</script>

</body>
</html>
